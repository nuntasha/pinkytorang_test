# 노드 그래프 v6.2 (입구 + 홀 테이블 4 + 주방 통로, 서버가 관리)
# 그림: node_map_v6.png   좌표 = 그림 비율로 잡은 설계값(m), 원점 = 보드 왼쪽 아래. SLAM 맵 완성 후 실측값으로 교체
#
# ID 규칙: T 테이블 정차 / D 도킹 / P 픽업 줄 / N 길 위의 점
# 필드: type PASS/STOP, stop_kind QUEUE/PICKUP/SERVE/DOCK, table, lock(코너만 false), pocket, yaw(STOP), next
# 테이블 정차점은 테이블 바로 아래 가로길 위에 있다. 서 있는 동안 뒤 로봇은 기다린다
# 오른쪽 아래 도킹 칸 2개: 칸막이로 나뉜 위 · 아래 칸, 로봇은 각 칸 아래 벽(도킹 스테이션)을 봄

nodes:
  # ---- 입구 통로 (양방향 1차선) ----
  - {id: D1, type: STOP, stop_kind: DOCK, lock: true, x: 0.150, y: 0.700, yaw: 0.0, next: [N1]}   # 입구 도킹 (안내 로봇, 입구 위 · 오른쪽 벽을 봄)
  - {id: N1, type: PASS, lock: true, x: 0.150, y: 1.675, next: [N2, D1]}   # 입구 통로 위 끝

  # ---- 윗길 (오른쪽 -> 왼쪽) ----
  - {id: N5, type: PASS, lock: false, x: 1.995, y: 1.675, next: [N4]}   # 주방 통로 위 모서리
  - {id: N4, type: PASS, lock: true, x: 1.695, y: 1.675, next: [N3]}   # 오른쪽 세로길 위 끝
  - {id: N3, type: PASS, lock: true, x: 1.075, y: 1.675, next: [N2, N7]}   # 가운데 세로길 위 끝
  - {id: N2, type: PASS, lock: true, x: 0.455, y: 1.675, next: [N6, N1]}   # 왼쪽 세로길 위 끝, 입구 통로 분기

  # ---- 위쪽 테이블 줄 (왼쪽 -> 오른쪽): T1, T2 아래에서 서빙 ----
  - {id: N6, type: PASS, lock: true, x: 0.455, y: 1.150, next: [N9, T1]}   # 왼쪽 세로길 · 위쪽 줄
  - {id: T1, type: STOP, stop_kind: SERVE, table: T1, lock: true, x: 0.765, y: 1.150, yaw: 0.0, next: [N7]}   # T1 아래 정차
  - {id: N7, type: PASS, lock: true, x: 1.075, y: 1.150, next: [N10, T2]}   # 가운데 세로길 · 위쪽 줄
  - {id: T2, type: STOP, stop_kind: SERVE, table: T2, lock: true, x: 1.385, y: 1.150, yaw: 0.0, next: [N8]}   # T2 아래 정차
  - {id: N8, type: PASS, lock: true, x: 1.695, y: 1.150, next: [N4]}   # 오른쪽 세로길 · 위쪽 줄

  # ---- 아래쪽 테이블 줄 (왼쪽 -> 오른쪽): T3, T4 아래에서 서빙 ----
  - {id: N9, type: PASS, lock: true, x: 0.455, y: 0.520, next: [N14, T3]}   # 왼쪽 세로길 · 아래쪽 줄
  - {id: T3, type: STOP, stop_kind: SERVE, table: T3, lock: true, x: 0.765, y: 0.520, yaw: 0.0, next: [N10]}   # T3 아래 정차
  - {id: N10, type: PASS, lock: true, x: 1.075, y: 0.520, next: [N15, T4]}   # 가운데 세로길 · 아래쪽 줄
  - {id: T4, type: STOP, stop_kind: SERVE, table: T4, lock: true, x: 1.385, y: 0.520, yaw: 0.0, next: [N11]}   # T4 아래 정차
  - {id: N11, type: PASS, lock: true, x: 1.695, y: 0.520, next: [N8]}   # 오른쪽 세로길 · 아래쪽 줄

  # ---- 아랫길 (왼쪽 -> 오른쪽) -> 주방 통로 ----
  - {id: N14, type: PASS, lock: false, x: 0.455, y: 0.145, next: [N15]}   # 왼쪽 아래 모서리
  - {id: N15, type: PASS, lock: true, x: 1.075, y: 0.145, next: [N16]}   # 가운데 세로길 아래 끝
  - {id: N16, type: PASS, lock: true, x: 1.695, y: 0.145, next: [N11, N12]}   # 오른쪽 세로길 아래 끝

  # ---- 주방 통로 (아래 -> 위) + 오른쪽 도킹 칸 ----
  - {id: N12, type: PASS, lock: true, x: 1.995, y: 0.145, next: [N13, D2]}   # 주방 통로 아래 끝, D2 앞
  - {id: N13, type: PASS, lock: true, x: 1.995, y: 0.502, next: [P2, D3]}   # D3 앞
  - {id: P2, type: STOP, stop_kind: QUEUE, lock: true, x: 1.995, y: 1.000, yaw: 1.5708, next: [P1]}   # 픽업 대기
  - {id: P1, type: STOP, stop_kind: PICKUP, lock: true, x: 1.995, y: 1.450, yaw: 1.5708, next: [N5]}   # 픽업 창구 (오른쪽이 주방 카운터)
  - {id: D2, type: STOP, stop_kind: DOCK, lock: true, x: 2.210, y: 0.160, yaw: -1.5708, next: [N12]}   # 도킹 아래 칸 (바닥 벽을 봄)
  - {id: D3, type: STOP, stop_kind: DOCK, lock: true, x: 2.210, y: 0.502, yaw: -1.5708, next: [N13]}   # 도킹 위 칸 (칸막이를 봄)

# 양방향 1차선: 들어갈 때 나가는 끝 노드(또는 도킹)까지 한 번에 잡는다
two_way_zones:
  - {id: Z1, nodes: [N2, N1, D1]}   # 입구 통로
