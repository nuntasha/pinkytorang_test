# 노드 그래프 v11 (최종맵). 테이블 6 세로 배치 · 도킹 4 (입구 D1 D2, 픽업 쪽 D3 D4). 그림: node_map_v11.png
# 좌표 = 2280 x 1820 mm 판 기준 (그림 비율로 잰 값, m), 원점 = 보드 왼쪽 아래. SLAM 맵 완성 후 실측값으로 교체
#
# nodes : {id, x, y} + 정차점이면 kind (QUEUE 대기 / PICKUP 픽업 / SERVE 테이블 / DOCK 도킹)
#         yaw(로봇 앞 = 카메라가 보는 방향, rad)는 방향이 정해진 정차점만 (도킹, 픽업). 테이블 정차점 id = 테이블 이름
#         lock 기본 true, 코너만 lock: false
# edges : 양방향 길 ([A, B, C] = A-B, B-C)   oneway: 일방통행 길 ([A, B, C] = A->B->C)
# reverse: 후진 구간 ([A, B, C] = A->B, B->C 를 후진으로). 첫 · 끝 노드는 lock 노드
#
# 정밀 정차 (로봇 쪽 설정, 마커 6개): D1 D2 (왼쪽 바깥 벽), D3 D4 (통로 건너 칸막이), N12 (오른쪽 벽 = 멈춤 위치, 아래 벽 = 축 고정)
# P1은 라인트레이싱(테이프)으로 바구니를 주방에 꽂는다

nodes:
  # ---- 윗길 (T1 T2는 위쪽 벽 쪽, 윗길에서 서빙)
  - {id: N1, x: 0.150, y: 1.525}                            # 입구 통로 위 끝
  - {id: N2, x: 0.455, y: 1.525}
  - {id: T1, kind: SERVE, x: 0.870, y: 1.525}
  - {id: N3, x: 1.075, y: 1.525}
  - {id: T2, kind: SERVE, x: 1.280, y: 1.525}
  - {id: N4, x: 1.695, y: 1.525}
  - {id: P1, kind: PICKUP, x: 1.995, y: 1.525, yaw: 3.1416} # 픽업: 후진으로 올라와 왼쪽을 보게 돌고, 바구니를 주방에 꽂음

  # ---- 가운데 줄 (T3 T4 아래에서 서빙)
  - {id: N6, x: 0.455, y: 1.100}
  - {id: T3, kind: SERVE, x: 0.870, y: 1.100}
  - {id: N7, x: 1.075, y: 1.100}
  - {id: T4, kind: SERVE, x: 1.280, y: 1.100}
  - {id: N8, x: 1.695, y: 1.100}

  # ---- 아래 줄 (T5 T6 아래에서 서빙)
  - {id: N9, x: 0.455, y: 0.635}
  - {id: T5, kind: SERVE, x: 0.870, y: 0.635}
  - {id: N10, x: 1.075, y: 0.635}
  - {id: T6, kind: SERVE, x: 1.280, y: 0.635}
  - {id: N11, x: 1.695, y: 0.635}

  # ---- 아랫길
  - {id: N14, x: 0.455, y: 0.145, lock: false}              # 왼쪽 아래 모서리
  - {id: N15, x: 1.075, y: 0.145}
  - {id: N16, x: 1.695, y: 0.145}
  - {id: N12, x: 1.995, y: 0.145}                           # 주방 통로 아래 끝: 마커로 멈춤 · 축 고정 후 후진

  # ---- 주방 통로 (아래 -> 위, 후진 · 바구니 앞장)
  - {id: N13, x: 1.995, y: 0.475}                           # D4 앞
  - {id: N17, x: 1.995, y: 0.675}                           # D3 앞
  - {id: P2, kind: QUEUE, x: 1.995, y: 1.000}               # 픽업 대기

  # ---- 도킹 (전부 왼쪽을 봄 = 카메라가 마커 쪽)
  - {id: D3, kind: DOCK, x: 2.120, y: 0.675, yaw: 3.1416}   # 픽업 쪽 위 칸 (후진으로 들어감)
  - {id: D4, kind: DOCK, x: 2.120, y: 0.475, yaw: 3.1416}   # 픽업 쪽 아래 칸 (후진으로 들어감)
  - {id: D2, kind: DOCK, x: 0.150, y: 0.905, yaw: 3.1416}   # 입구 앞칸
  - {id: D1, kind: DOCK, x: 0.150, y: 0.700, yaw: 3.1416}   # 입구 뒤칸 (D2를 지나 드나듦)

edges:
  - [N1, N2, T1, N3, T2, N4]
  - [N2, N6, N9, N14]
  - [N3, N7, N10, N15]
  - [N4, N8, N11, N16]
  - [N6, T3, N7, T4, N8]
  - [N9, T5, N10, T6, N11]
  - [N14, N15, N16, N12]
  - [N1, D2, D1]                 # 입구 통로 (한 줄)
  - [N13, D4]
  - [N17, D3]

oneway:
  - [N12, N13, N17, P2, P1, N4]  # 주방 통로는 아래 -> 위, 픽업 후 전진으로 윗길 (N4 -> P1로 바로 들어오지 않게 일방)

reverse:
  - [N12, N13, N17, P2, P1]      # N12에서 돌아서 후진으로 픽업까지
  - [N13, D4]                    # 픽업 쪽 도킹은 후진으로 들어가고 전진으로 나옴
  - [N17, D3]
