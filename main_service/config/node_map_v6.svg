="40" y="677.6" font-size="10" fill="#555" font-weight="400" text-anchor="start" dominant-baseline="central">안내: D1 → N1 → N2 → 왼쪽 세로길(T1·T3) 또는 아랫길 → 오른쪽 세로길(T4·T2) → 윗길 → N2 → D1 (주방 통로 안 지남)</text></svg>